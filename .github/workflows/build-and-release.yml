name: Build and Release

on:
  push:
    branches:
      - main

jobs:
  check_version:
    runs-on: ubuntu-latest
    outputs:
      version_changed: ${{ steps.check_version.outputs.version_changed }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Extract current version
        id: current_version
        run: |
          VERSION=$(python setup.py --version)
          echo "current_version=$VERSION" >> $GITHUB_OUTPUT

      - name: Check previous version
        id: check_version
        run: |
          git checkout HEAD^ -- setup.py
          PREV_VERSION=$("0.0.0" || echo "0.0.0")  # dummy value for now for testing
          CURRENT_VERSION="${{ steps.current_version.outputs.current_version }}"
          if [ "$PREV_VERSION" != "$CURRENT_VERSION" ]; then
            echo "version_changed=true" >> $GITHUB_OUTPUT
          else
            echo "version_changed=false" >> $GITHUB_OUTPUT
          fi

  compile:
    needs: check_version
    if: needs.check_version.outputs.version_changed == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up GCC (Linux)
        if: matrix.os == 'ubuntu-latest'
        uses: egor-tensin/setup-gcc@v1
        with:
          version: latest
          platform: x64

      - name: Set up Clang (macOS)
        if: matrix.os == 'macos-latest'
        run: brew install llvm

      - name: Set up MinGW (Windows)
        if: matrix.os == 'windows-latest'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc

      - name: Compile shared library (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: gcc -shared -fPIC -o pgse/c_lib/aho_corasick.so pgse/c_lib/aho_corasick.c

      - name: Compile universal shared library (macOS)
        if: matrix.os == 'macos-latest'
        run: clang -shared -fPIC -arch x86_64 -arch arm64 -o pgse/c_lib/aho_corasick.dylib pgse/c_lib/aho_corasick.c

      - name: Compile shared library (Windows)
        if: matrix.os == 'windows-latest'
        shell: msys2 {0}
        run: gcc -shared -o pgse/c_lib/aho_corasick.dll pgse/c_lib/aho_corasick.c

      - name: Upload compiled library
        uses: actions/upload-artifact@v4
        with:
          name: shared-lib-${{ matrix.os }}
          path: pgse/c_lib/aho_corasick.*

  build_and_test:
    needs: compile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Download compiled libraries
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Move compiled libraries
        run: |
          cp artifacts/shared-lib-ubuntu-latest/aho_corasick.so pgse/c_lib/
          cp artifacts/shared-lib-macos-latest/aho_corasick.dylib pgse/c_lib/
          cp artifacts/shared-lib-windows-latest/aho_corasick.dll pgse/c_lib/

      - name: Install build dependencies
        run: pip install build wheel twine

      - name: Build wheel
        run: python -m build --wheel

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: dist/*.whl

      - name: Install wheel
        run: pip install dist/*.whl

      - name: Run tests
        run: |
          pgse-train --label-file "tests/resource/labels.csv" --data-dir "tests/resource/genomes" --save-file "action.save" --export-file "action" --folds 2
          pgse-predict --model-file "action_fold_0.json" --segments-file "action_fold_0_segs.csv" --data-dir "tests/resource/genomes"

  release:
    needs: build_and_test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Download wheel artifact
        uses: actions/download-artifact@v4
        with:
          name: wheel
          path: dist

      - name: Install Twine
        run: pip install twine

      - name: Upload to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: twine upload dist/*.whl