name: Build and Release

permissions:  # Allow correct permissions for the GITHUB_TOKEN
  contents: write
  packages: write

on:
  push:
    branches:
      - main

jobs:
  check_version:
    runs-on: ubuntu-latest
    outputs:
      version_changed: ${{ steps.check_version.outputs.version_changed }}
      current_version: ${{ steps.current_version.outputs.current_version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Extract current version
        id: current_version
        run: |
          VERSION=$(grep -E '^version = ' pyproject.toml | head -1 | sed -E 's/^version = "(.*)"/\1/')
          echo "current_version=$VERSION" >> $GITHUB_OUTPUT

      - name: Check previous version
        id: check_version
        run: |
          git checkout HEAD^ -- pyproject.toml
          PREV_VERSION=$(grep -E '^version = ' pyproject.toml | head -1 | sed -E 's/^version = "(.*)"/\1/' || echo "0.0.0")
          CURRENT_VERSION="${{ steps.current_version.outputs.current_version }}"
          if [ "$PREV_VERSION" != "$CURRENT_VERSION" ]; then
            echo "version_changed=true" >> $GITHUB_OUTPUT
          else
            echo "version_changed=false" >> $GITHUB_OUTPUT
          fi
          git checkout HEAD -- pyproject.toml

      - name: Debug captured versions
        run: |
          echo ">>> step.current_version.outputs.current_version = '${{ steps.current_version.outputs.current_version }}'"
          echo ">>> step.check_version.outputs.version_changed   = '${{ steps.check_version.outputs.version_changed }}'"

  # One abi3 wheel per platform, each bundling the compiled Rust counting kernel
  # (pgse._native). cibuildwheel installs Rust in the manylinux container (see
  # [tool.cibuildwheel.linux] in pyproject.toml); on the macOS/Windows runners Rust
  # is installed on the host below.
  build_wheels:
    needs: check_version
    if: needs.check_version.outputs.version_changed == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust (host runner)
        if: matrix.os != 'ubuntu-latest'
        uses: dtolnay/rust-toolchain@stable

      - name: Build wheels
        uses: pypa/cibuildwheel@v2.22.0

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  build_sdist:
    needs: check_version
    if: needs.check_version.outputs.version_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Build sdist
        run: pipx run build --sdist

      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  release:
    needs: [build_wheels, build_sdist, check_version]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List distributions
        run: ls -R dist

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check_version.outputs.current_version }}
          name: Release v${{ needs.check_version.outputs.current_version }}
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Twine
        run: pip install twine

      - name: Upload to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: twine upload dist/*
