[package]
name = "pgse-native"
version = "0.1.0"
edition = "2021"
publish = false

# Built by setuptools-rust into the Python package as `pgse._native`.
[lib]
name = "pgse_native"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.23", features = ["extension-module", "abi3-py310"] }
numpy = "0.23"
aho-corasick = "1.1"
rayon = "1.10"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
