[build-system]
requires = ["setuptools>=77", "wheel", "setuptools-rust>=1.9,<2"]
build-backend = "setuptools.build_meta"

[project]
name = "pgse"
version = "0.15.0"

description = "Progressive Genome Segment Enhancement (PGSE)"
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
    { name = "Yinzheng Zhong", email = "yinzheng.zhong@liverpool.ac.uk" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "ray~=2.46.0",
    "numpy~=2.2.6",
    "scipy~=1.15",
    "xgboost~=3.0.4",
    "pandas~=2.3.1",
    "imbalanced-learn~=0.13.0",
    "scikit-learn~=1.6.1",
    "setuptools~=80.9.0",
    "colorlog~=6.9.0",
    "tqdm~=4.67.1",
]

[project.urls]
Homepage = "https://github.com/yinzheng-zhong/pgse"
Repository = "https://github.com/yinzheng-zhong/pgse"

[project.scripts]
pgse-train = "pgse.cli:train"
pgse-predict = "pgse.cli:predict"

[dependency-groups]
# Development-only tools, installed with `uv sync` (add `--no-dev` to skip).
dev = [
    "pytest~=8.3",
    "mypy~=1.13",
]

[tool.setuptools.packages.find]
include = ["pgse", "pgse.*"]

# The native Aho-Corasick counting kernel (Rust). Built into the package as
# `pgse._native`. optional = false makes any build FAIL if a Rust toolchain is not
# available. `py-limited-api` matches the abi3-py310 feature in
# native/Cargo.toml, so a single wheel per platform covers CPython 3.10+.
[[tool.setuptools-rust.ext-modules]]
target = "pgse._native"
path = "native/Cargo.toml"
binding = "PyO3"
py-limited-api = true
optional = false

[tool.cibuildwheel]
# One abi3 wheel per platform (built on 3.10, valid for 3.10+). musllinux, PyPy and
# 32-bit are not targeted.
build = "cp310-*"
skip = "*-musllinux* pp* *_i686 *-win32"
build-frontend = "build"
# Prove the compiled kernel is present and correct on every wheel.
test-requires = "pytest"
test-command = "python -c \"from pgse import _native; assert _native.SegmentMatcher(['ab','abc'], None).n_segments == 2\" && python -m pytest {project}/tests/unit/test_native_counting.py {project}/tests/unit/test_counting_alphabet.py {project}/tests/unit/test_lazy_imports.py -q"

[tool.cibuildwheel.linux]
# manylinux containers have no Rust; install it once per container.
before-all = "curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal"
environment = { PATH = "$HOME/.cargo/bin:$PATH" }

# macOS builds the runner's native architecture only (arm64 on macos-latest). This
# avoids cross-compiling the Rust extension, which is the least reliable path; add an
# Intel runner (macos-13) to the workflow matrix if x86_64 wheels are needed.
[tool.cibuildwheel.macos]
archs = ["native"]
