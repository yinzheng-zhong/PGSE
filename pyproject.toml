[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "_build_backend"
backend-path = ["."]

[project]
name = "pgse"
version = "0.9.1"
description = "Progressive Genome Segment Enhancement (PGSE)"
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
    { name = "Yinzheng Zhong", email = "yinzheng.zhong@liverpool.ac.uk" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "ray~=2.46.0",
    "numpy~=2.2.6",
    "xgboost~=3.0.4",
    "pandas~=2.3.1",
    "imbalanced-learn~=0.13.0",
    "scikit-learn~=1.6.1",
    "setuptools~=80.9.0",
    "colorlog~=6.9.0",
    "tqdm~=4.67.1",
]

[project.urls]
Homepage = "https://github.com/yinzheng-zhong/pgse"
Repository = "https://github.com/yinzheng-zhong/pgse"

[project.scripts]
pgse-train = "pgse.cli:train"
pgse-predict = "pgse.cli:predict"

[dependency-groups]
# Development-only tools, installed with `uv sync` (add `--no-dev` to skip).
dev = [
    "pytest~=8.3",
    "mypy~=1.13",
]

[tool.setuptools.packages.find]
include = ["pgse", "pgse.*"]

[tool.setuptools.package-data]
# Ship both the prebuilt shared libraries and the C source (so it can be
# recompiled from an installed copy).
pgse = ["c_lib/*.so", "c_lib/*.dylib", "c_lib/*.dll", "c_lib/*.c"]
